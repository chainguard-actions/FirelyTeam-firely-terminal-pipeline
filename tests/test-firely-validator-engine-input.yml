name: Test FIRELY_TERMINAL_VALIDATOR_ENGINE input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test package.json
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "description": "Test FHIR project",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create test conformance resources directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resources"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password
          DOTNET_VALIDATION_ENABLED: "false"
          JAVA_VALIDATION_ENABLED: "false"
          SUSHI_ENABLED: "false"
          FIRELY_TERMINAL_VALIDATOR_ENGINE: "firely"

      - name: Assert action completed
        run: |
          echo "Action completed successfully with FIRELY_TERMINAL_VALIDATOR_ENGINE input"
          echo "PASS"
