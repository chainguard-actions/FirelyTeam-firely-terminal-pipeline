name: Test - Path To Examples Input
on:
  workflow_dispatch:

jobs:
  test-path-to-examples-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json fixture
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create minimal conformance resources and examples directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resources"
          mkdir -p "$GITHUB_WORKSPACE/examples"

      # Test that PATH_TO_EXAMPLES input is accepted without errors
      # when Java validation is disabled (the examples validation step is skipped)
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          PATH_TO_EXAMPLES: examples
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action accepted PATH_TO_EXAMPLES input without errors
        run: |
          echo "PASS: Action accepted PATH_TO_EXAMPLES=examples and completed with validation disabled"
