name: Test missing package.json and sushi-config.yaml fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no dependency files at workspace root
        run: |
          if [ -f package.json ] || [ -f sushi-config.yaml ]; then
            echo "Unexpected dependency file present at root"
            exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/slicing
          SIMPLIFIER_USERNAME: dummy@example.com
          SIMPLIFIER_PASSWORD: dummy-password
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'true'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no package.json/sushi-config.yaml exists"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: validator should not have been downloaded"
            exit 1
          fi
          echo "PASS"
