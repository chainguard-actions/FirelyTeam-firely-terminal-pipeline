name: Test - missing package.json error
on:
  workflow_dispatch:

jobs:
  test-missing-package-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create conformance resources directory (no package.json)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/conformance"
          # Ensure no package.json or sushi-config.yaml exists at workspace root
          rm -f "$GITHUB_WORKSPACE/package.json" "$GITHUB_WORKSPACE/sushi-config.yaml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: fake-password
          DOTNET_VALIDATION_ENABLED: true
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          FIRELY_TERMINAL_VERSION: '3.5.0'
          JAVA_VALIDATOR_VERSION: '6.10.4'
          SUSHI_VERSION: '3.20.1'

      - name: Assert action failed due to missing package.json
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because neither package.json nor sushi-config.yaml exists
          # when validation is enabled (DOTNET_VALIDATION_ENABLED=true)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when package.json is missing"
          else
            echo "FAIL: expected action to fail when package.json and sushi-config.yaml are both missing"
            exit 1
          fi
