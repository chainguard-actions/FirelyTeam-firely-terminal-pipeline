name: Test - PATH_TO_QUALITY_CONTROL_RULES input coverage
on:
  workflow_dispatch:

jobs:
  test-quality-control-rules-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json fixture
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "description": "Test FHIR project",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create conformance resources directory
        run: mkdir -p "$GITHUB_WORKSPACE/conformance"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          PATH_TO_QUALITY_CONTROL_RULES: conformance/qc-rules
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: fake-password
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          FIRELY_TERMINAL_VERSION: '3.5.0'
          JAVA_VALIDATOR_VERSION: '6.10.4'
          SUSHI_VERSION: '3.20.1'

      - name: Assert action completed successfully
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to succeed when both validators are disabled with PATH_TO_QUALITY_CONTROL_RULES set"
            exit 1
          fi
          echo "PASS: action completed successfully with PATH_TO_QUALITY_CONTROL_RULES input provided"
