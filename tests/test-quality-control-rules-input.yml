name: Test - PATH_TO_QUALITY_CONTROL_RULES input coverage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json at workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF
          echo "package.json created"

      - name: Create conformance resources directory
        run: mkdir -p "$GITHUB_WORKSPACE/conformance"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          PATH_TO_QUALITY_CONTROL_RULES: quality-control/rules
          DOTNET_VALIDATION_ENABLED: "false"
          JAVA_VALIDATION_ENABLED: "false"
          SUSHI_ENABLED: "false"
          SIMPLIFIER_USERNAME: "dummy@example.com"
          SIMPLIFIER_PASSWORD: "dummy-password"

      - name: Assert action completed with PATH_TO_QUALITY_CONTROL_RULES input
        run: |
          echo "Action completed successfully with PATH_TO_QUALITY_CONTROL_RULES input provided"
          echo "PASS"
