name: Test - .NET options are ignored when validation is disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up workspace files
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": { "hl7.fhir.r4.core": "4.0.1" }
          }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/conformance-opts" "$GITHUB_WORKSPACE/qc"
          cat > "$GITHUB_WORKSPACE/conformance-opts/sd.json" << 'EOF'
          {"resourceType": "StructureDefinition", "url": "http://example.org/sd", "name": "Test"}
          EOF
          printf -- '- name: dummy\n  action: parse\n' > "$GITHUB_WORKSPACE/qc/custom.rules.yaml"
          sha256sum "$GITHUB_WORKSPACE/package.json" > /tmp/pkg.sha

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance-opts
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_CONFORMANCE_JAVA
          FIRELY_TERMINAL_VALIDATOR_ENGINE: netsdk
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action succeeded and left package.json untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! sha256sum -c /tmp/pkg.sha; then
            echo "FAIL: package.json was modified"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: Java validator should not have been downloaded"
            exit 1
          fi
          echo "PASS"
