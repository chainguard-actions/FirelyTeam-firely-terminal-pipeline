name: Test .NET options are ignored when validation is disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure clean workspace root
        run: rm -f "$GITHUB_WORKSPACE/package.json" "$GITHUB_WORKSPACE/sushi-config.yaml" "$GITHUB_WORKSPACE/validator_cli.jar"
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/profiles
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_CONFORMANCE_JAVA
          FIRELY_TERMINAL_VALIDATOR_ENGINE: not-a-valid-engine
          PATH_TO_QUALITY_CONTROL_RULES: tests/fixtures/qc/custom
      - name: Assert success and no side effects
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (engine/QC/expected-fails only apply to .NET validation)"; exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/package.json" ]; then
            echo "FAIL: package.json should not have been generated"; exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: Java validator should not have been downloaded"; exit 1
          fi
          echo "PASS"
