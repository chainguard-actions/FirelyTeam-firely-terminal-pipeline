name: Test .NET-specific options are ignored when all validation is disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/slicing
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          FIRELY_TERMINAL_VALIDATOR_ENGINE: netsdk
          PATH_TO_QUALITY_CONTROL_RULES: tests/fixtures/nonexistent-rules
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_CONFORMANCE_JAVA VALIDATION_EXAMPLES_JAVA
      - name: Assert action succeeded without running .NET/Java steps
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -f package.json ]; then
            echo "FAIL: package.json should not have been generated"
            exit 1
          fi
          if [ -f validator_cli.jar ]; then
            echo "FAIL: Java validator should not have been downloaded"
            exit 1
          fi
          if [ -e "$RUNNER_TEMP/fhir-check/validation.json" ]; then
            echo "FAIL: QC report should not exist when .NET validation is disabled"
            exit 1
          fi
          echo "PASS"
