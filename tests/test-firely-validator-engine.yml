name: Test FIRELY_TERMINAL_VALIDATOR_ENGINE input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal fixture files
        run: |
          mkdir -p hardened/tests/fixtures/conformance
          # Create a minimal package.json so the action can detect FHIR version if needed
          cat > package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: hardened/tests/fixtures/conformance
          FIRELY_TERMINAL_VALIDATOR_ENGINE: firely
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password
          SUSHI_ENABLED: false

      - name: Assert action completed
        run: |
          echo "Action completed successfully with FIRELY_TERMINAL_VALIDATOR_ENGINE input"
          echo "PASS"
