name: Test missing package.json and sushi-config.yaml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no dependency files exist at the workspace root
        run: |
          if [ -f package.json ] || [ -f sushi-config.yaml ]; then
            echo "FAIL: precondition - repo root unexpectedly contains package.json or sushi-config.yaml"
            exit 1
          fi
          echo "precondition OK"
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          SIMPLIFIER_USERNAME: nobody@example.com
          SIMPLIFIER_PASSWORD: not-used
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'true'
      - name: Assert action failed during dependency detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because neither package.json nor sushi-config.yaml exists"
            exit 1
          fi
          if [ -f validator_cli.jar ]; then
            echo "FAIL: action should have stopped before downloading the Java validator"
            exit 1
          fi
          echo "PASS"
