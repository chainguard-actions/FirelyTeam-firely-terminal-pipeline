name: Test - dotnet validation requires dotnet to be installed
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up package.json at workspace root
      - name: Set up test package.json
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      # Verify dotnet availability in this environment
      - name: Check dotnet availability
        id: check-dotnet
        run: |
          if command -v dotnet &> /dev/null; then
            echo "dotnet_available=true" >> "$GITHUB_OUTPUT"
            echo "dotnet is available: $(dotnet --version)"
          else
            echo "dotnet_available=false" >> "$GITHUB_OUTPUT"
            echo "dotnet is NOT available (expected for this test)"
          fi

      # When dotnet is not available and DOTNET_VALIDATION_ENABLED=true, action should fail
      # When dotnet IS available, action may fail later (Simplifier login with fake credentials)
      - name: Run action with dotnet validation enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          DOTNET_VALIDATION_ENABLED: true
          JAVA_VALIDATION_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert correct behavior based on dotnet availability
        env:
          DOTNET_AVAILABLE: ${{ steps.check-dotnet.outputs.dotnet_available }}
          ACTION_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "dotnet_available: $DOTNET_AVAILABLE"
          echo "action_outcome: $ACTION_OUTCOME"
          if [ "$DOTNET_AVAILABLE" = "false" ]; then
            # dotnet not available - action should have failed
            if [ "$ACTION_OUTCOME" = "failure" ]; then
              echo "PASS: Action correctly failed when dotnet is not installed"
            else
              echo "FAIL: Action should have failed when dotnet is not installed but outcome was: $ACTION_OUTCOME"
              exit 1
            fi
          else
            # dotnet is available - action may succeed or fail for other reasons (credentials, network)
            echo "dotnet is available, action outcome: $ACTION_OUTCOME (acceptable)"
            echo "PASS: dotnet prerequisite check passed"
          fi
