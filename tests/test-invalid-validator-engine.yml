name: Test invalid validator engine
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare project files
        run: |
          rm -f sushi-config.yaml
          cat > package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": { "hl7.fhir.r4.core": "4.0.1" }
          }
          EOF
      - name: Install fake dotnet and fhir
        run: |
          BIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$BIN"
          LOG="$RUNNER_TEMP/fhir-args.log"
          : > "$LOG"
          cat > "$BIN/dotnet" <<EOF
          #!/bin/bash
          echo "dotnet \$*" >> "$LOG"
          if [ "\$1" = "--version" ]; then echo "8.0.100"; fi
          exit 0
          EOF
          cat > "$BIN/fhir" <<EOF
          #!/bin/bash
          echo "fhir \$*" >> "$LOG"
          case "\$1" in
            -v) echo "Firely Terminal 4.0.0" ;;
            restore) echo "Restored hl7.fhir.r4.core@4.0.1" ;;
          esac
          exit 0
          EOF
          chmod +x "$BIN"/*
          echo "$BIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: fhir-test/conformance
          SIMPLIFIER_USERNAME: user@example.com
          SIMPLIFIER_PASSWORD: secret
          DOTNET_VALIDATION_ENABLED: 'true'
          JAVA_VALIDATION_ENABLED: 'false'
          FIRELY_TERMINAL_VALIDATOR_ENGINE: bogus
      - name: Assert action failed before quality checks
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          LOG="$RUNNER_TEMP/fhir-args.log"
          cat "$LOG"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid validator engine"
            exit 1
          fi
          if grep -q "^fhir check" "$LOG" || grep -q "fhir config validator" "$LOG"; then
            echo "FAIL: fhir check/config validator should not run with invalid engine"
            exit 1
          fi
          grep -qxF "fhir spec R4" "$LOG" || { echo "FAIL: earlier steps did not run"; exit 1; }
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f package.json
