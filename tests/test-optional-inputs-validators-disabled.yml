name: Test - Optional inputs are accepted and ignored when validators are disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure no package files at workspace root
        run: |
          rm -f "$GITHUB_WORKSPACE/package.json"
          rm -f "$GITHUB_WORKSPACE/sushi-config.yaml"
          rm -f "$GITHUB_WORKSPACE/validator_cli.jar"

      # With DOTNET/JAVA/SUSHI all disabled, EXPECTED_FAILS, FIRELY_TERMINAL_VALIDATOR_ENGINE,
      # PATH_TO_EXAMPLES, PATH_TO_QUALITY_CONTROL_RULES and SUSHI_OPTIONS must be accepted
      # without triggering any validator, sushi run, or engine validation.
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          PATH_TO_EXAMPLES: tests/fixtures/fhir-r4/examples
          PATH_TO_QUALITY_CONTROL_RULES: tests/fixtures/qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_CONFORMANCE_JAVA VALIDATION_EXAMPLES_JAVA
          FIRELY_TERMINAL_VALIDATOR_ENGINE: not-a-valid-engine
          SUSHI_OPTIONS: --this-flag-would-fail-if-sushi-ran
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action succeeded and did nothing validator-related
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FHIR_VERSION_ENV: ${{ env.FHIR_VERSION }}
        run: |
          echo "outcome: $OUTCOME"
          echo "FHIR_VERSION: '$FHIR_VERSION_ENV'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "$FHIR_VERSION_ENV" ]; then
            echo "FAIL: FHIR version detection should have been skipped"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: Java validator should not have been downloaded"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/package.json" ]; then
            echo "FAIL: package.json should not have been generated"
            exit 1
          fi
          echo "PASS"
