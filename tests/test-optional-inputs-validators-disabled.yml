name: Test - Optional inputs accepted when validators are disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up package.json at workspace root
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fhir-r4/package.json" "$GITHUB_WORKSPACE/package.json"
          cat "$GITHUB_WORKSPACE/package.json"

      # All optional inputs are passed. With validators and SUSHI disabled, the
      # action must skip every step that consumes them and finish successfully.
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          PATH_TO_EXAMPLES: tests/fixtures/fhir-r4/examples
          PATH_TO_QUALITY_CONTROL_RULES: tests/fixtures/qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_EXAMPLES_JAVA
          FIRELY_TERMINAL_VALIDATOR_ENGINE: firely
          SUSHI_OPTIONS: '--out fsh-generated'
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action succeeded and did not generate SUSHI output
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/fsh-generated" ]; then
            echo "FAIL: SUSHI ran although SUSHI_ENABLED=false"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: Java validator downloaded although JAVA_VALIDATION_ENABLED=false"
            exit 1
          fi
          echo "PASS"
