name: Test - Optional inputs with validators disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fixture package.json
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: "tests/fixtures"
          PATH_TO_EXAMPLES: "tests/fixtures/examples"
          PATH_TO_QUALITY_CONTROL_RULES: "tests/fixtures/custom"
          EXPECTED_FAILS: "VALIDATION_CONFORMANCE_DOTNET VALIDATION_EXAMPLES_JAVA"
          FIRELY_TERMINAL_VALIDATOR_ENGINE: "firely"
          SUSHI_OPTIONS: "--log-level error"
          DOTNET_VALIDATION_ENABLED: "false"
          JAVA_VALIDATION_ENABLED: "false"
          SUSHI_ENABLED: "false"
          SIMPLIFIER_USERNAME: "test@example.com"
          SIMPLIFIER_PASSWORD: "test-password"

      - name: Assert action succeeded and did not run SUSHI or download Java validator
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: Java validator should not be downloaded when disabled"
            exit 1
          fi
          echo "PASS"
