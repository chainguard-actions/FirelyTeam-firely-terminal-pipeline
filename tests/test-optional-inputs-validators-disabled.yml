name: Test - Optional inputs accepted when validators disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal project files
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/conformance" "$GITHUB_WORKSPACE/examples"
          sha256sum "$GITHUB_WORKSPACE/package.json" > /tmp/package.json.sha

      # All validators/SUSHI disabled: optional inputs must be accepted and not
      # trigger any tool invocation (fhir/java/sushi are not installed).
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          PATH_TO_EXAMPLES: examples
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_EXAMPLES_JAVA
          FIRELY_TERMINAL_VALIDATOR_ENGINE: firely
          SUSHI_OPTIONS: '--snapshot'
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
          SIMPLIFIER_USERNAME: 'test@example.com'
          SIMPLIFIER_PASSWORD: 'testpassword'

      - name: Assert action completed and left project untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! sha256sum -c /tmp/package.json.sha; then
            echo "FAIL: package.json was modified"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: Java validator should not have been downloaded"
            exit 1
          fi
          echo "PASS"
