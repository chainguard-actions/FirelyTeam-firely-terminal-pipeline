name: Test - Optional inputs passed with validators and SUSHI disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal project files
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"
          mkdir -p "$GITHUB_WORKSPACE/conformance" "$GITHUB_WORKSPACE/examples"
          cat > "$GITHUB_WORKSPACE/conformance/sd.json" <<'EOF'
          {"resourceType":"StructureDefinition","url":"http://example.org/sd","differential":{"element":[{"id":"Patient.identifier","slicing":{"rules":"open"}}]}}
          EOF
          sha256sum "$GITHUB_WORKSPACE/package.json" "$GITHUB_WORKSPACE/conformance/sd.json" > /tmp/before.sha

      # All optional inputs are set, but since every validator and SUSHI are
      # disabled the action must skip the steps consuming them and succeed.
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          PATH_TO_EXAMPLES: examples
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_CONFORMANCE_JAVA VALIDATION_EXAMPLES_JAVA
          FIRELY_TERMINAL_VALIDATOR_ENGINE: netsdk
          SUSHI_OPTIONS: '--out fsh-generated'
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
          CLOSE_SLICING_FOR_VALIDATION: 'false'
          SIMPLIFIER_USERNAME: 'test@example.com'
          SIMPLIFIER_PASSWORD: 'testpassword'

      - name: Assert action succeeded and left files untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! sha256sum -c /tmp/before.sha; then
            echo "FAIL: action modified project files"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/fsh-generated" ]; then
            echo "FAIL: SUSHI should not have run"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: Java validator should not have been downloaded"
            exit 1
          fi
          echo "PASS"
