name: Test - Error when no package.json or sushi-config.yaml
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure no package.json or sushi-config.yaml exist in the workspace
      - name: Remove any existing package.json or sushi-config.yaml
        run: |
          rm -f "$GITHUB_WORKSPACE/package.json"
          rm -f "$GITHUB_WORKSPACE/sushi-config.yaml"
          echo "Removed package.json and sushi-config.yaml if they existed"

      # Create a minimal conformance resources directory
      - name: Create conformance resources directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resources"
          cat > "$GITHUB_WORKSPACE/resources/StructureDefinition-example.json" << 'EOF'
          {
            "resourceType": "StructureDefinition",
            "id": "example",
            "url": "http://example.org/StructureDefinition/example",
            "name": "Example",
            "status": "draft",
            "kind": "resource",
            "abstract": false,
            "type": "Patient",
            "baseDefinition": "http://hl7.org/fhir/StructureDefinition/Patient",
            "derivation": "constraint"
          }
          EOF

      # The action should fail because neither package.json nor sushi-config.yaml exists
      # We use JAVA_VALIDATION_ENABLED: true to trigger FHIR version detection without
      # needing dotnet/Firely Terminal installed (which would fail with fake credentials first)
      # We use continue-on-error to capture the failure and assert it happened
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no package.json or sushi-config.yaml exists, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no package.json or sushi-config.yaml was found"
