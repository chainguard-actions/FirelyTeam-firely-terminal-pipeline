name: Test - Missing package.json causes error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure no package.json or sushi-config.yaml exists in workspace root.
      # The action looks for these files in $GITHUB_WORKSPACE (CWD of action steps).
      - name: Remove any package.json or sushi-config.yaml from workspace root
        run: |
          rm -f "$GITHUB_WORKSPACE/package.json"
          rm -f "$GITHUB_WORKSPACE/sushi-config.yaml"
          echo "Workspace root contents:"
          ls -la "$GITHUB_WORKSPACE/" | head -20

      # With DOTNET_VALIDATION_ENABLED=true and JAVA_VALIDATION_ENABLED=true:
      # The action will fail because:
      # 1. dotnet may not be installed (fails at "Check if .NET is installed"), OR
      # 2. Firely.Terminal install fails, OR
      # 3. Simplifier login fails with fake credentials, OR
      # 4. FHIR version detection fails (no package.json or sushi-config.yaml)
      # Any of these failures is acceptable - the action must not succeed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          DOTNET_VALIDATION_ENABLED: 'true'
          JAVA_VALIDATION_ENABLED: 'true'
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password
          SUSHI_ENABLED: 'false'

      - name: Assert action failed (dotnet not found, login failure, or missing package.json)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail: either at dotnet check, Simplifier login
          # (fake credentials), or at FHIR version detection (no package.json or sushi-config.yaml).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed as expected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed (no valid package.json or sushi-config.yaml, fake credentials)"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
