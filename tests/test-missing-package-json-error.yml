name: Test error when no package.json or sushi-config.yaml
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure no package.json or sushi-config.yaml exists in the workspace
      - name: Remove any existing package.json or sushi-config.yaml
        run: |
          rm -f package.json sushi-config.yaml
          echo "Removed package.json and sushi-config.yaml if they existed"

      # Create a minimal conformance resources directory
      - name: Create conformance resources directory
        run: mkdir -p conformance

      # The action should fail because neither package.json nor sushi-config.yaml exists.
      # JAVA_VALIDATION_ENABLED=true triggers FHIR version detection, which exits 1 when
      # neither config file is found. The action fails before any network calls.
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          SUSHI_ENABLED: false
          SUSHI_USE_CONFIG_DEPENDENCIES: false
          TERMINOLOGY_SERVICE_BFARM_ENABLED: false
          JAVA_SNAPSHOT_ENABLED: false
          CLOSE_SLICING_FOR_VALIDATION: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: testpassword

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail when no package.json or sushi-config.yaml exists, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: Action correctly failed when no package.json or sushi-config.yaml was found"
