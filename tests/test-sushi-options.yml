name: Test SUSHI options passed through
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake npm/sudo/sushi
        run: |
          rm -f package.json sushi-config.yaml /tmp/fake-sushi.log /tmp/fake-sudo.log
          mkdir -p /tmp/fakebin-sushi
          cat > /tmp/fakebin-sushi/npm <<'EOF'
          #!/bin/sh
          echo "npm $*" >> /tmp/fake-sudo.log
          [ "$1" = "--version" ] && echo "10.0.0"
          exit 0
          EOF
          cat > /tmp/fakebin-sushi/sudo <<'EOF'
          #!/bin/sh
          echo "sudo $*" >> /tmp/fake-sudo.log
          exit 0
          EOF
          cat > /tmp/fakebin-sushi/sushi <<'EOF'
          #!/bin/sh
          if [ "$1" = "-v" ]; then echo "SUSHI v3.21.0"; exit 0; fi
          i=0
          for a in "$@"; do i=$((i+1)); echo "arg$i=$a" >> /tmp/fake-sushi.log; done
          exit 0
          EOF
          chmod +x /tmp/fakebin-sushi/*
          echo "/tmp/fakebin-sushi" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: fsh-generated/resources
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'true'
          SUSHI_OPTIONS: '--snapshot -o out-dir'
      - name: Assert SUSHI received split options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- sudo/npm log ---"; cat /tmp/fake-sudo.log || true
          echo "--- sushi log ---"; cat /tmp/fake-sushi.log || true
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! grep -q "fsh-sushi@3.21.0" /tmp/fake-sudo.log; then
            echo "FAIL: expected fsh-sushi@3.21.0 install"
            exit 1
          fi
          EXPECTED=$(printf 'arg1=--snapshot\narg2=-o\narg3=out-dir')
          ACTUAL=$(cat /tmp/fake-sushi.log)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: unexpected sushi args"
            exit 1
          fi
          echo "PASS"
