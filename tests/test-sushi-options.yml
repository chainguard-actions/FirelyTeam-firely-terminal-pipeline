name: Test SUSHI enabled with custom SUSHI_OPTIONS (mocked npm/sushi)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no sushi-config.yaml (skip yq install)
        run: rm -f sushi-config.yaml
      - name: Install fake sudo, npm and sushi
        run: |
          BIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$BIN"
          LOG="$RUNNER_TEMP/sushi-args.log"
          : > "$LOG"
          cat > "$BIN/sudo" <<EOF
          #!/bin/bash
          echo "sudo \$*" >> "$LOG"
          if [ "\$1" = "chown" ]; then exit 0; fi
          exec "\$@"
          EOF
          cat > "$BIN/npm" <<EOF
          #!/bin/bash
          echo "npm \$*" >> "$LOG"
          if [ "\$1" = "--version" ]; then echo "10.0.0"; fi
          exit 0
          EOF
          cat > "$BIN/sushi" <<EOF
          #!/bin/bash
          echo "sushi \$*" >> "$LOG"
          if [ "\$1" = "-v" ]; then echo "SUSHI v3.21.0"; fi
          exit 0
          EOF
          chmod +x "$BIN"/*
          echo "$BIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: fhir-test/conformance
          SIMPLIFIER_USERNAME: user@example.com
          SIMPLIFIER_PASSWORD: secret
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'true'
          SUSHI_VERSION: '3.21.0'
          SUSHI_OPTIONS: 'fsh-project --out generated-output'
      - name: Assert sushi invoked with SUSHI_OPTIONS
        run: |
          LOG="$RUNNER_TEMP/sushi-args.log"
          cat "$LOG"
          for s in "npm --version" "npm install -g fsh-sushi@3.21.0" "sushi -v" "sushi fsh-project --out generated-output"; do
            grep -qxF -- "$s" "$LOG" || { echo "FAIL: missing call '$s'"; exit 1; }
          done
          COUNT=$(grep -cxF -- "sushi fsh-project --out generated-output" "$LOG")
          echo "sushi build invocations: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected exactly one SUSHI build (no slicing re-run)"
            exit 1
          fi
          echo "PASS"
