name: Test - Missing package.json fails when validation enabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create conformance resources directory (no package.json or sushi-config.yaml)
        run: |
          mkdir -p conformance-resources
          rm -f package.json sushi-config.yaml

      - name: Run action expecting failure (no package.json with validation enabled)
        id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance-resources
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: testpassword

      - name: Assert action failed due to missing package.json
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail when no package.json or sushi-config.yaml exists with validation enabled"
            exit 1
          fi
          echo "PASS: Action correctly failed when neither package.json nor sushi-config.yaml was found"
