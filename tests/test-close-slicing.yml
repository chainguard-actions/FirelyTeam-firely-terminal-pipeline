name: Test - Close slicing pre-processing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal package.json with FHIR R4 version info
      - name: Create package.json fixture
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "description": "Test FHIR project",
            "fhirVersions": [
              "4.0.1"
            ],
            "dependencies": {}
          }
          EOF

      # Create a StructureDefinition with open slicing (should be closed by the action)
      - name: Create conformance resources with open slicing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resources"
          cat > "$GITHUB_WORKSPACE/resources/StructureDefinition-sliced.json" << 'EOF'
          {
            "resourceType": "StructureDefinition",
            "id": "sliced-example",
            "url": "http://example.org/StructureDefinition/sliced-example",
            "name": "SlicedExample",
            "status": "draft",
            "kind": "resource",
            "abstract": false,
            "type": "Observation",
            "baseDefinition": "http://hl7.org/fhir/StructureDefinition/Observation",
            "derivation": "constraint",
            "differential": {
              "element": [
                {
                  "id": "Observation.category",
                  "path": "Observation.category",
                  "slicing": {
                    "discriminator": [
                      {
                        "type": "pattern",
                        "path": "$this"
                      }
                    ],
                    "rules": "open"
                  }
                }
              ]
            }
          }
          EOF

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          CLOSE_SLICING_FOR_VALIDATION: true
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert slicing was closed
        run: |
          echo "Checking that slicing rules were changed from 'open' to 'closed'..."
          SLICING_RULES=$(jq -r '.differential.element[0].slicing.rules' "$GITHUB_WORKSPACE/resources/StructureDefinition-sliced.json")
          echo "actual slicing rules: $SLICING_RULES"
          if [ "$SLICING_RULES" != "closed" ]; then
            echo "FAIL: expected slicing rules to be 'closed' but got '$SLICING_RULES'"
            exit 1
          fi
          echo "PASS: slicing rules were correctly changed to 'closed'"
