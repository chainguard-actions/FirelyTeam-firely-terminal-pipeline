name: Test - package.json takes precedence over sushi-config.yaml by default
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create package.json (should take precedence)
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create sushi-config.yaml (should be ignored when package.json exists and SUSHI_USE_CONFIG_DEPENDENCIES=false)
        run: |
          cat > sushi-config.yaml << 'EOF'
          id: test-project
          name: TestProject
          fhirVersion: 5.0.0
          dependencies: {}
          EOF

      - name: Create minimal conformance resources directory
        run: mkdir -p conformance

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SUSHI_USE_CONFIG_DEPENDENCIES: false
          SIMPLIFIER_USERNAME: dummy@example.com
          SIMPLIFIER_PASSWORD: dummy-password

      - name: Assert action completed successfully
        run: |
          echo "PASS: Action completed - package.json took precedence over sushi-config.yaml"
