name: Test - Close slicing disabled (default behavior)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal project files
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"
          mkdir -p "$GITHUB_WORKSPACE/conformance"

      # With CLOSE_SLICING_FOR_VALIDATION=false (default), the pre-processing step
      # that modifies StructureDefinition slicing rules should be skipped entirely.
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
          CLOSE_SLICING_FOR_VALIDATION: 'false'
          SIMPLIFIER_USERNAME: 'test@example.com'
          SIMPLIFIER_PASSWORD: 'testpassword'

      - name: Assert action completed with slicing pre-processing skipped
        run: |
          echo "PASS: action completed - CLOSE_SLICING_FOR_VALIDATION=false skips pre-processing"
