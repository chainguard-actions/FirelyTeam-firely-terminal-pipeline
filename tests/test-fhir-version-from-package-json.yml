name: Test - FHIR version detection from package.json with dotnet enabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a FHIR R4 project with package.json
      - name: Set up project with package.json (FHIR R4 / 4.0.1)
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"
          mkdir -p "$GITHUB_WORKSPACE/conformance"

      # With DOTNET_VALIDATION_ENABLED=true, the action will:
      # 1. Check dotnet is installed (passes on ubuntu-latest)
      # 2. Detect FHIR version 4.0.1 from package.json
      # 3. Install Firely Terminal
      # 4. Attempt Simplifier login → fails with invalid credentials
      # The action is expected to fail at the login step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: 'true'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
          SIMPLIFIER_USERNAME: 'invalid@example.com'
          SIMPLIFIER_PASSWORD: 'invalidpassword'
          FIRELY_TERMINAL_VERSION: '3.5.0'

      - name: Assert action failed gracefully at login (sentinel repo / invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at Simplifier login as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (login may be lenient or skipped in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
