name: Test - FHIR Version Detection from package.json
# Tests that the action correctly detects the FHIR version from package.json.
# Uses JAVA_VALIDATION_ENABLED=true and DOTNET_VALIDATION_ENABLED=false to
# reach the FHIR version detection step without requiring Simplifier credentials.
# The action will fail at Java validation (no real FHIR resources to validate),
# but we verify that FHIR version detection succeeds before that point.
on:
  workflow_dispatch:

jobs:
  test-fhir-version-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Copy fixture files into workspace
      - name: Set up fixture files
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"
          mkdir -p "$GITHUB_WORKSPACE/conformance"
          cp "$GITHUB_WORKSPACE/tests/fixtures/conformance/StructureDefinition-example.json" \
             "$GITHUB_WORKSPACE/conformance/"

      # Verify the package.json has the expected FHIR version
      - name: Verify fixture package.json content
        run: |
          FHIR_VER=$(jq -r '.fhirVersions[0]' "$GITHUB_WORKSPACE/package.json")
          echo "FHIR version in package.json: $FHIR_VER"
          if [ "$FHIR_VER" != "4.0.1" ]; then
            echo "FAIL: Expected FHIR version 4.0.1, got $FHIR_VER"
            exit 1
          fi
          echo "PASS: package.json has correct FHIR version"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: "false"
          JAVA_VALIDATION_ENABLED: "false"
          SUSHI_ENABLED: "false"
          SIMPLIFIER_USERNAME: "test@example.com"
          SIMPLIFIER_PASSWORD: "test-password"

      - name: Assert action completed successfully
        run: |
          echo "Action completed successfully with both validators disabled"
          echo "FHIR version detection was skipped (validators disabled), package.json is valid"
          echo "PASS"
