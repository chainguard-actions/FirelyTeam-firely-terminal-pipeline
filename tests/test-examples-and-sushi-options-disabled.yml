name: Test - PATH_TO_EXAMPLES and SUSHI_OPTIONS ignored when disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up workspace files
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": { "hl7.fhir.r4.core": "4.0.1" }
          }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/conformance-ex" "$GITHUB_WORKSPACE/examples-ex"
          cat > "$GITHUB_WORKSPACE/conformance-ex/sd.json" << 'EOF'
          {"resourceType": "StructureDefinition", "url": "http://example.org/sd", "name": "Test"}
          EOF
          cat > "$GITHUB_WORKSPACE/examples-ex/patient.json" << 'EOF'
          {"resourceType": "Patient", "id": "example"}
          EOF

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance-ex
          PATH_TO_EXAMPLES: examples-ex
          SUSHI_OPTIONS: '. --snapshot'
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action succeeded and did not run SUSHI
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/fsh-generated" ]; then
            echo "FAIL: SUSHI output found although SUSHI was disabled"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/examples-ex/patient.json" ]; then
            echo "FAIL: example file missing"
            exit 1
          fi
          echo "PASS"
