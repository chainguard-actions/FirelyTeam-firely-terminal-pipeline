name: Test SUSHI_USE_CONFIG_DEPENDENCIES requires sushi-config.yaml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json (but no sushi-config.yaml)
        run: |
          rm -f sushi-config.yaml
          cat > package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/slicing
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'true'
          SUSHI_USE_CONFIG_DEPENDENCIES: 'true'
      - name: Assert action failed and package.json untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when sushi-config.yaml is missing"
            exit 1
          fi
          NAME=$(jq -r '.name' package.json)
          echo "package.json name: $NAME"
          if [ "$NAME" != "test-project" ]; then
            echo "FAIL: package.json should not have been overwritten"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f package.json validator_cli.jar
