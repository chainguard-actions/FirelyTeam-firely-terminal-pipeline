name: Test SUSHI_USE_CONFIG_DEPENDENCIES requires sushi-config.yaml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json but no sushi-config.yaml
        run: |
          rm -f sushi-config.yaml
          echo '{"name":"t","version":"0.1.0","fhirVersions":["4.0.1"],"dependencies":{}}' > package.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: fhir-conformance
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: dummy-password
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'true'
          SUSHI_USE_CONFIG_DEPENDENCIES: 'true'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when SUSHI_USE_CONFIG_DEPENDENCIES=true without sushi-config.yaml"
            exit 1
          fi
          if [ -f validator_cli.jar ]; then
            echo "FAIL: validator should not have been downloaded"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f package.json
