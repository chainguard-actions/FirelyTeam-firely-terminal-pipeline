name: Test SUSHI_USE_CONFIG_DEPENDENCIES without sushi-config.yaml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no sushi-config.yaml at repo root
        run: |
          if [ -f sushi-config.yaml ]; then
            echo "Precondition failed: sushi-config.yaml exists"
            exit 1
          fi
          mkdir -p .sushi-work
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: .sushi-work
          SIMPLIFIER_USERNAME: nobody@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'true'
          SUSHI_USE_CONFIG_DEPENDENCIES: 'true'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when SUSHI_USE_CONFIG_DEPENDENCIES=true and sushi-config.yaml is missing"
            exit 1
          fi
          if [ -f package.json ]; then
            echo "FAIL: package.json should not be generated"
            exit 1
          fi
          echo "PASS"
