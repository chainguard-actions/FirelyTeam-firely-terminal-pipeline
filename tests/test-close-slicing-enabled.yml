name: Test - Close slicing enabled modifies StructureDefinitions
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json fixture
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create conformance resources directory with a StructureDefinition that has open slicing
        run: |
          mkdir -p conformance
          # This profile has no children (no other profile extends it), so slicing should be closed
          cat > conformance/LeafProfile.json << 'EOF'
          {
            "resourceType": "StructureDefinition",
            "id": "LeafProfile",
            "url": "http://example.org/fhir/StructureDefinition/LeafProfile",
            "name": "LeafProfile",
            "status": "draft",
            "kind": "resource",
            "abstract": false,
            "type": "Patient",
            "baseDefinition": "http://hl7.org/fhir/StructureDefinition/Patient",
            "derivation": "constraint",
            "differential": {
              "element": [
                {
                  "id": "Patient.identifier",
                  "path": "Patient.identifier",
                  "slicing": {
                    "discriminator": [{"type": "value", "path": "system"}],
                    "rules": "open"
                  }
                }
              ]
            }
          }
          EOF

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          CLOSE_SLICING_FOR_VALIDATION: true
          SIMPLIFIER_USERNAME: dummy@example.com
          SIMPLIFIER_PASSWORD: dummy-password

      - name: Assert slicing rules were closed for leaf profile
        run: |
          RULES=$(jq -r '.differential.element[0].slicing.rules' conformance/LeafProfile.json)
          echo "slicing.rules after action: $RULES"
          if [ "$RULES" != "closed" ]; then
            echo "FAIL: Expected slicing rules to be 'closed' but got '$RULES'"
            exit 1
          fi
          echo "PASS: Slicing rules were changed to 'closed' as expected"
