name: Test - Close slicing enabled modifies StructureDefinition
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal package.json with FHIR version
      - name: Create test package.json
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "description": "Test FHIR project",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      # Create a StructureDefinition with open slicing that has no children (leaf profile)
      # The close-slicing logic only closes slicings on profiles that are NOT extended by others
      - name: Create test conformance resources with open slicing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resources"
          # This is a leaf profile (no other profile has this as baseDefinition)
          cat > "$GITHUB_WORKSPACE/resources/LeafProfile.json" << 'EOF'
          {
            "resourceType": "StructureDefinition",
            "id": "LeafProfile",
            "url": "http://example.org/fhir/StructureDefinition/LeafProfile",
            "name": "LeafProfile",
            "status": "draft",
            "kind": "resource",
            "abstract": false,
            "type": "Patient",
            "baseDefinition": "http://hl7.org/fhir/StructureDefinition/Patient",
            "derivation": "constraint",
            "differential": {
              "element": [
                {
                  "id": "Patient.identifier",
                  "path": "Patient.identifier",
                  "slicing": {
                    "discriminator": [{"type": "value", "path": "system"}],
                    "rules": "open"
                  }
                }
              ]
            }
          }
          EOF

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          CLOSE_SLICING_FOR_VALIDATION: true

      - name: Assert slicing rules changed to closed
        run: |
          SLICING_RULES=$(jq -r '.differential.element[0].slicing.rules' "$GITHUB_WORKSPACE/resources/LeafProfile.json")
          echo "actual slicing rules: $SLICING_RULES"
          if [ "$SLICING_RULES" != "closed" ]; then
            echo "FAIL: Expected slicing rules to be 'closed' but got '$SLICING_RULES'"
            exit 1
          fi
          echo "PASS: Slicing rules changed to 'closed' as expected when CLOSE_SLICING_FOR_VALIDATION=true"
