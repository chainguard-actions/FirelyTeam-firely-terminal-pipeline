name: Test .NET validator engine and QC rules (mocked Firely Terminal)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up project and fake dotnet/fhir
        run: |
          rm -f sushi-config.yaml /tmp/fake-fhir.log
          cat > package.json <<'EOF'
          {
            "name": "test",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {
              "hl7.fhir.r4.core": "4.0.1"
            }
          }
          EOF
          mkdir -p /tmp/fakebin-fhir
          cat > /tmp/fakebin-fhir/dotnet <<'EOF'
          #!/bin/sh
          [ "$1" = "--version" ] && echo "8.0.100"
          exit 0
          EOF
          cat > /tmp/fakebin-fhir/fhir <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-fhir.log
          case "$*" in
            "-v") echo "Firely Terminal 3.4.0" ;;
            "check --help") echo "Usage: fhir check [rules] --fail" ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin-fhir/*
          echo "/tmp/fakebin-fhir" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          SIMPLIFIER_USERNAME: user@example.com
          SIMPLIFIER_PASSWORD: secret
          DOTNET_VALIDATION_ENABLED: 'true'
          JAVA_VALIDATION_ENABLED: 'false'
          FIRELY_TERMINAL_VALIDATOR_ENGINE: netsdk
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
      - name: Assert Firely Terminal calls
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- fhir log ---"; cat /tmp/fake-fhir.log || true
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          for expected in "login email=user@example.com password=secret" "spec R4" "restore" "config validator netsdk" "check qc/custom --fail"; do
            if ! grep -qxF -- "$expected" /tmp/fake-fhir.log; then
              echo "FAIL: missing fhir call '$expected'"
              exit 1
            fi
          done
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f package.json
