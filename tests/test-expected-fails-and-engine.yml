name: Test EXPECTED_FAILS, PATH_TO_QUALITY_CONTROL_RULES, and FIRELY_TERMINAL_VALIDATOR_ENGINE inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json for FHIR version detection
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create conformance resources directory
        run: mkdir -p "$GITHUB_WORKSPACE/conformance"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET
          PATH_TO_QUALITY_CONTROL_RULES: some/rules/path
          FIRELY_TERMINAL_VALIDATOR_ENGINE: firely

      - name: Assert action completed successfully
        run: |
          echo "PASS: Action completed with EXPECTED_FAILS, PATH_TO_QUALITY_CONTROL_RULES, and FIRELY_TERMINAL_VALIDATOR_ENGINE inputs"
