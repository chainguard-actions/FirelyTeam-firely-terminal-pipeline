name: Test EXPECTED_FAILS and FIRELY_TERMINAL_VALIDATOR_ENGINE inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json for action
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create conformance resources directory
        run: mkdir -p "$GITHUB_WORKSPACE/resources"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET
          FIRELY_TERMINAL_VALIDATOR_ENGINE: firely
          PATH_TO_QUALITY_CONTROL_RULES: rules/custom
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action completed successfully
        run: |
          echo "Action completed with both validators disabled"
          echo "EXPECTED_FAILS, FIRELY_TERMINAL_VALIDATOR_ENGINE, and PATH_TO_QUALITY_CONTROL_RULES inputs were accepted"
          echo "PASS"
