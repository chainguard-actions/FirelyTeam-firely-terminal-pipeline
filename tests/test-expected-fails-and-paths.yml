name: Test - EXPECTED_FAILS, PATH_TO_EXAMPLES, PATH_TO_QUALITY_CONTROL_RULES inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Copy fixture package.json to workspace root so FHIR version detection can find it
      - name: Set up fixture package.json
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: "tests/fixtures/conformance"
          PATH_TO_EXAMPLES: "tests/fixtures/conformance"
          PATH_TO_QUALITY_CONTROL_RULES: "tests/fixtures/minimal"
          EXPECTED_FAILS: "VALIDATION_CONFORMANCE_DOTNET VALIDATION_CONFORMANCE_JAVA VALIDATION_EXAMPLES_JAVA"
          DOTNET_VALIDATION_ENABLED: "false"
          JAVA_VALIDATION_ENABLED: "false"
          SUSHI_ENABLED: "false"
          SIMPLIFIER_USERNAME: "test@example.com"
          SIMPLIFIER_PASSWORD: "test-password"

      - name: Assert action completed successfully
        run: |
          echo "Action completed with EXPECTED_FAILS, PATH_TO_EXAMPLES, and PATH_TO_QUALITY_CONTROL_RULES set"
          echo "PASS: action ran without errors when both validators are disabled and optional path inputs are provided"
