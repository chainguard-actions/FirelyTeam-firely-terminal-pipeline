name: Test - Missing package.json and sushi-config.yaml Error
# Tests that the action fails with a clear error when neither package.json
# nor sushi-config.yaml is present and validation is enabled.
# Uses JAVA_VALIDATION_ENABLED=true and DOTNET_VALIDATION_ENABLED=false to
# bypass the Simplifier login step and reach FHIR version detection.
on:
  workflow_dispatch:

jobs:
  test-no-package-json-error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up conformance resources but NO package.json or sushi-config.yaml
      - name: Set up fixture files (no package.json, no sushi-config.yaml)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/conformance"
          cp "$GITHUB_WORKSPACE/tests/fixtures/conformance/StructureDefinition-example.json" \
             "$GITHUB_WORKSPACE/conformance/"
          # Ensure neither config file exists
          rm -f "$GITHUB_WORKSPACE/package.json"
          rm -f "$GITHUB_WORKSPACE/sushi-config.yaml"

      - name: Verify neither config file is present
        run: |
          if [ -f "$GITHUB_WORKSPACE/package.json" ]; then
            echo "FAIL: package.json should not exist for this test"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/sushi-config.yaml" ]; then
            echo "FAIL: sushi-config.yaml should not exist for this test"
            exit 1
          fi
          echo "PASS: Neither package.json nor sushi-config.yaml present"

      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: "false"
          JAVA_VALIDATION_ENABLED: "true"
          SUSHI_ENABLED: "false"
          SIMPLIFIER_USERNAME: "test@example.com"
          SIMPLIFIER_PASSWORD: "test-password"

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because neither package.json nor sushi-config.yaml exists.
          # With JAVA_VALIDATION_ENABLED=true and DOTNET_VALIDATION_ENABLED=false,
          # the action bypasses Simplifier login and reaches FHIR version detection,
          # where it fails with "Neither package.json nor sushi-config.yaml found."
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no package.json or sushi-config.yaml)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when neither package.json nor sushi-config.yaml is present"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
