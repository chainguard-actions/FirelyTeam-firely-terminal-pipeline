name: Test - Error when SUSHI_USE_CONFIG_DEPENDENCIES=true but no sushi-config.yaml
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create package.json but NOT sushi-config.yaml
      - name: Create package.json but no sushi-config.yaml
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "description": "Test FHIR project",
            "fhirVersions": [
              "4.0.1"
            ],
            "dependencies": {}
          }
          EOF
          rm -f "$GITHUB_WORKSPACE/sushi-config.yaml"
          echo "Created package.json, removed sushi-config.yaml"

      # Create a minimal conformance resources directory
      - name: Create conformance resources directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resources"
          cat > "$GITHUB_WORKSPACE/resources/StructureDefinition-example.json" << 'EOF'
          {
            "resourceType": "StructureDefinition",
            "id": "example",
            "url": "http://example.org/StructureDefinition/example",
            "name": "Example",
            "status": "draft",
            "kind": "resource",
            "abstract": false,
            "type": "Patient",
            "baseDefinition": "http://hl7.org/fhir/StructureDefinition/Patient",
            "derivation": "constraint"
          }
          EOF

      # The action should fail because SUSHI_USE_CONFIG_DEPENDENCIES=true but no sushi-config.yaml
      # We use JAVA_VALIDATION_ENABLED: true to trigger FHIR version detection without
      # needing dotnet/Firely Terminal installed (which would fail with fake credentials first)
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          SUSHI_USE_CONFIG_DEPENDENCIES: true
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SUSHI_USE_CONFIG_DEPENDENCIES=true but no sushi-config.yaml, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SUSHI_USE_CONFIG_DEPENDENCIES=true but sushi-config.yaml was missing"
