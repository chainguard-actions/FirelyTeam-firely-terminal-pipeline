name: Test - Error when SUSHI_USE_CONFIG_DEPENDENCIES=true but no sushi-config.yaml
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up package.json but no sushi-config.yaml.
      # With SUSHI_USE_CONFIG_DEPENDENCIES=true and JAVA_VALIDATION_ENABLED=true,
      # the action will attempt FHIR version detection and fail with:
      # "ERROR: SUSHI_USE_CONFIG_DEPENDENCIES=true but sushi-config.yaml not found"
      # This failure happens before any network-dependent steps.
      - name: Set up package.json without sushi-config.yaml
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fhir-r4/package.json" "$GITHUB_WORKSPACE/package.json"
          rm -f "$GITHUB_WORKSPACE/sushi-config.yaml"
          echo "package.json present, sushi-config.yaml absent"
          ls -la "$GITHUB_WORKSPACE/" | grep -E "package|sushi" || echo "Only package.json found (expected)"

      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          SUSHI_USE_CONFIG_DEPENDENCIES: true
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action failed because sushi-config.yaml is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when SUSHI_USE_CONFIG_DEPENDENCIES=true but sushi-config.yaml is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
