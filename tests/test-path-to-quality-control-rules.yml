name: Test - PATH_TO_QUALITY_CONTROL_RULES input accepted
on:
  workflow_dispatch:

jobs:
  test-path-to-quality-control-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal package.json so the action has something to work with
      - name: Create minimal package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: hardened/tests/fixtures/conformance
          PATH_TO_QUALITY_CONTROL_RULES: hardened/tests/fixtures/qc/minimal
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password
          FIRELY_TERMINAL_VERSION: '3.5.0'
          JAVA_VALIDATOR_VERSION: '6.9.5'
          SUSHI_VERSION: '3.18.1'

      - name: Assert action completed successfully with PATH_TO_QUALITY_CONTROL_RULES input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to succeed when validators are disabled and PATH_TO_QUALITY_CONTROL_RULES is set"
            exit 1
          fi
          echo "PASS: action accepted PATH_TO_QUALITY_CONTROL_RULES input and completed successfully"
