name: Test action succeeds when sushi-config.yaml is present
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a sushi-config.yaml (no package.json) for the action to detect
      - name: Create sushi-config.yaml fixture
        run: |
          cat > sushi-config.yaml << 'EOF'
          id: test.fhir.project
          canonical: http://example.org/fhir
          name: TestFHIRProject
          status: active
          version: 1.0.0
          fhirVersion: 4.0.1
          dependencies:
            hl7.fhir.r4.core: 4.0.1
          EOF
          echo "Created sushi-config.yaml:"
          cat sushi-config.yaml

      # Create a minimal conformance resources directory
      - name: Create conformance resources directory
        run: mkdir -p conformance

      # With both validators disabled, FHIR version detection is skipped entirely,
      # so the action should complete successfully even with only sushi-config.yaml present.
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SUSHI_USE_CONFIG_DEPENDENCIES: false
          TERMINOLOGY_SERVICE_BFARM_ENABLED: false
          JAVA_SNAPSHOT_ENABLED: false
          CLOSE_SLICING_FOR_VALIDATION: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: testpassword

      - name: Assert action completed successfully
        run: |
          echo "Action completed with sushi-config.yaml present"
          echo "PASS: Action ran successfully when sushi-config.yaml is present and validators are disabled"
