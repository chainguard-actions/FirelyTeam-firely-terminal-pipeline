name: Test PATH_TO_EXAMPLES and SUSHI_OPTIONS are ignored when Java and SUSHI are disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/slicing
          PATH_TO_EXAMPLES: tests/fixtures/slicing
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
          SUSHI_OPTIONS: '--snapshot $(touch /tmp/sushi-injection)'
      - name: Assert action succeeded and SUSHI/Java did not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -e /tmp/sushi-injection ]; then
            echo "FAIL: SUSHI_OPTIONS content was executed"
            exit 1
          fi
          if [ -d fsh-generated ]; then
            echo "FAIL: SUSHI should not have generated output"
            exit 1
          fi
          if [ -f validator_cli.jar ]; then
            echo "FAIL: Java validator should not have been downloaded"
            exit 1
          fi
          if ! git diff --quiet -- tests/fixtures/slicing; then
            echo "FAIL: fixtures should be unchanged"
            exit 1
          fi
          echo "PASS"
