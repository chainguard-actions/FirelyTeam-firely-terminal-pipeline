name: Test - Optional inputs accepted when validators and SUSHI are disabled
on:
  workflow_dispatch:

jobs:
  test-optional-inputs-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/conformance
          PATH_TO_EXAMPLES: tests/fixtures/examples
          PATH_TO_QUALITY_CONTROL_RULES: tests/fixtures/qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_EXAMPLES_JAVA
          FIRELY_TERMINAL_VALIDATOR_ENGINE: netsdk
          SUSHI_OPTIONS: '--out ./fsh-generated'
          SUSHI_ENABLED: false
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password
          FIRELY_TERMINAL_VERSION: '3.5.0'
          JAVA_VALIDATOR_VERSION: '6.9.5'
          SUSHI_VERSION: '3.18.1'

      - name: Assert action completed successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when validators/SUSHI are disabled"
            exit 1
          fi
          echo "PASS"

      - name: Assert no side effects from disabled features
        run: |
          if [ -f validator_cli.jar ]; then
            echo "FAIL: Java validator should not be downloaded when disabled"
            exit 1
          fi
          if [ -d fsh-generated ]; then
            echo "FAIL: SUSHI should not run when disabled"
            exit 1
          fi
          if ! grep -q '"test-project"' package.json; then
            echo "FAIL: package.json should not be overwritten"
            exit 1
          fi
          echo "PASS"
