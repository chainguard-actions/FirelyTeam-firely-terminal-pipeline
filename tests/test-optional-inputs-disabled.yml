name: Test optional inputs are ignored when validation and SUSHI are disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests
          PATH_TO_EXAMPLES: tests/examples
          PATH_TO_QUALITY_CONTROL_RULES: tests/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_EXAMPLES_JAVA
          FIRELY_TERMINAL_VALIDATOR_ENGINE: netsdk
          SUSHI_OPTIONS: --log-level debug
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
      - name: Assert action succeeded without running validators or SUSHI
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "FHIR_VERSION: '${FHIR_VERSION:-}'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "${FHIR_VERSION:-}" ]; then
            echo "FAIL: FHIR version detection should have been skipped"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: Java validator should not have been downloaded"
            exit 1
          fi
          if [ -d "$RUNNER_TEMP/fhir-check" ] && [ -f "$RUNNER_TEMP/fhir-check/validation.json" ]; then
            echo "FAIL: QC report should not have been generated"
            exit 1
          fi
          echo "PASS"
