name: Test - Optional inputs passed with validators and SUSHI disabled
on:
  workflow_dispatch:

jobs:
  test-optional-inputs-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixtures
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/conformance" "$GITHUB_WORKSPACE/examples"
          echo '{"resourceType":"Patient","id":"p1"}' > "$GITHUB_WORKSPACE/examples/patient.json"
          sha256sum "$GITHUB_WORKSPACE/examples/patient.json" > /tmp/examples.sha

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          PATH_TO_EXAMPLES: examples
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_CONFORMANCE_JAVA VALIDATION_EXAMPLES_JAVA
          SUSHI_OPTIONS: --out ./fsh-generated
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: fake-password
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false

      - name: Assert action succeeded and did not touch examples or run sushi
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! sha256sum -c /tmp/examples.sha; then
            echo "FAIL: example file was modified"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/fsh-generated" ]; then
            echo "FAIL: SUSHI output exists although SUSHI was disabled"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: Java validator downloaded although Java validation disabled"
            exit 1
          fi
          echo "PASS"
