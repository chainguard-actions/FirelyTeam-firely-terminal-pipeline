name: Test - Error when neither package.json nor sushi-config.yaml exists
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Ensure no package.json or sushi-config.yaml at workspace root.
      # With JAVA_VALIDATION_ENABLED=true, the action will attempt FHIR version detection
      # and fail with "ERROR: Neither package.json nor sushi-config.yaml found."
      # This failure happens before any network-dependent steps (Java validator download).
      - name: Remove package files from workspace root
        run: |
          rm -f "$GITHUB_WORKSPACE/package.json"
          rm -f "$GITHUB_WORKSPACE/sushi-config.yaml"
          echo "Confirmed: no package.json or sushi-config.yaml at workspace root"
          ls -la "$GITHUB_WORKSPACE/" | grep -E "package|sushi" || echo "No package/sushi files found (expected)"

      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action failed with missing package files error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when neither package.json nor sushi-config.yaml exists"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
