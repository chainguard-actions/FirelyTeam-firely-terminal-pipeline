name: Test SUSHI_USE_CONFIG_DEPENDENCIES flag
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create both package.json and sushi-config.yaml
      # When SUSHI_USE_CONFIG_DEPENDENCIES=true, sushi-config.yaml should take precedence
      - name: Create package.json and sushi-config.yaml fixtures
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "description": "Test FHIR project (should be ignored)",
            "fhirVersions": [
              "3.0.2"
            ],
            "dependencies": {}
          }
          EOF

          cat > sushi-config.yaml << 'EOF'
          id: test.fhir.project
          canonical: http://example.org/fhir
          name: TestFHIRProject
          status: active
          version: 1.0.0
          fhirVersion: 4.0.1
          dependencies:
            hl7.fhir.r4.core: 4.0.1
          EOF

          echo "Created both package.json and sushi-config.yaml"

      # Create a minimal conformance resources directory
      - name: Create conformance resources directory
        run: mkdir -p conformance

      # With both validators disabled, FHIR detection is skipped entirely.
      # The action should complete successfully regardless of which config file is present.
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SUSHI_USE_CONFIG_DEPENDENCIES: true
          TERMINOLOGY_SERVICE_BFARM_ENABLED: false
          JAVA_SNAPSHOT_ENABLED: false
          CLOSE_SLICING_FOR_VALIDATION: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: testpassword

      - name: Assert action completed successfully using sushi-config.yaml
        run: |
          echo "Action completed with SUSHI_USE_CONFIG_DEPENDENCIES=true"
          echo "PASS: Action correctly completed when SUSHI_USE_CONFIG_DEPENDENCIES=true and sushi-config.yaml is present"
