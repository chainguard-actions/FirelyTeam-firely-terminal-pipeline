name: Test - .NET validation enabled (fails gracefully at dotnet check or Simplifier login)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Copy fixture package.json to workspace root so the action can detect FHIR version.
      # Do NOT put sushi-config.yaml at workspace root to avoid the yq install step.
      - name: Set up fixture package.json
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/fhir-r4/package.json" "$GITHUB_WORKSPACE/package.json"
          rm -f "$GITHUB_WORKSPACE/sushi-config.yaml"
          echo "package.json contents:"
          cat "$GITHUB_WORKSPACE/package.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          DOTNET_VALIDATION_ENABLED: true
          JAVA_VALIDATION_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: fake-password-for-testing

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because:
          # - dotnet may not be available in the act container, OR
          # - Simplifier credentials are fake (login will fail)
          # Either way, the action should fail gracefully (not crash unexpectedly).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - dotnet unavailable or fake Simplifier credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded - Simplifier login may have been lenient"
            echo "PASS: action completed (possibly with lenient login behavior)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
