name: Test - Optional validator inputs are accepted when validators are disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create package.json and resources
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/resources" "$GITHUB_WORKSPACE/examples"
          cat > "$GITHUB_WORKSPACE/resources/StructureDefinition-example.json" << 'EOF'
          {
            "resourceType": "StructureDefinition",
            "id": "example",
            "url": "http://example.org/StructureDefinition/example",
            "name": "Example",
            "status": "draft",
            "kind": "resource",
            "abstract": false,
            "type": "Patient",
            "baseDefinition": "http://hl7.org/fhir/StructureDefinition/Patient",
            "derivation": "constraint"
          }
          EOF
          cat > "$GITHUB_WORKSPACE/examples/Patient-example.json" << 'EOF'
          { "resourceType": "Patient", "id": "example" }
          EOF
          sha256sum resources/*.json examples/*.json > /tmp/before.sha

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          PATH_TO_EXAMPLES: examples
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_EXAMPLES_JAVA
          FIRELY_TERMINAL_VALIDATOR_ENGINE: netsdk
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action succeeded and files untouched
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! sha256sum -c /tmp/before.sha; then
            echo "FAIL: resources/examples were modified"
            exit 1
          fi
          if [ -f validator_cli.jar ]; then
            echo "FAIL: Java validator should not have been downloaded"
            exit 1
          fi
          echo "PASS"
