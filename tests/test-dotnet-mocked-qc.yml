name: Test .NET validation with mocked Firely Terminal (engine, QC rules, expected fails)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up project files and fake dotnet / fhir
        run: |
          rm -f sushi-config.yaml /tmp/fhir-calls.log
          cat > package.json <<'EOF'
          {
            "name": "test-project",
            "version": "0.1.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {
              "hl7.fhir.r4.core": "4.0.1"
            }
          }
          EOF
          mkdir -p fhir-conformance
          echo '{"resourceType":"ValueSet","url":"http://example.org/ValueSet/vs","status":"draft"}' > fhir-conformance/vs.json

          FAKEBIN="$RUNNER_TEMP/fakebin"
          mkdir -p "$FAKEBIN"
          cat > "$FAKEBIN/dotnet" <<'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then echo "8.0.100"; exit 0; fi
          echo "dotnet $*" >> /tmp/fhir-calls.log
          exit 0
          EOF
          cat > "$FAKEBIN/fhir" <<'EOF'
          #!/bin/sh
          echo "fhir $*" >> /tmp/fhir-calls.log
          case "$1" in
            -v) echo "Firely Terminal 3.9.9"; exit 0 ;;
            check)
              # Old-style help without --failOn: no report produced
              for a in "$@"; do
                if [ "$a" = "--help" ]; then echo "Usage: fhir check [rules] --fail"; exit 0; fi
              done
              for a in "$@"; do
                if [ "$a" = "--fail" ]; then echo "QC found errors"; exit 1; fi
              done
              echo "QC found errors (not failing)"
              exit 0
              ;;
          esac
          exit 0
          EOF
          chmod +x "$FAKEBIN/dotnet" "$FAKEBIN/fhir"
          echo "$FAKEBIN" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: fhir-conformance
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: dummy-password
          DOTNET_VALIDATION_ENABLED: 'true'
          JAVA_VALIDATION_ENABLED: 'false'
          FIRELY_TERMINAL_VALIDATOR_ENGINE: netsdk
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET
      - name: Assert Firely Terminal invocations
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "calls:"; cat /tmp/fhir-calls.log || true
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ "${FHIR_VERSION:-}" != "4.0.1" ]; then
            echo "FAIL: expected FHIR_VERSION=4.0.1, got '${FHIR_VERSION:-}'"
            exit 1
          fi
          for expected in "fhir login email=test@example.com password=dummy-password" \
                          "fhir spec R4" "fhir restore" "fhir config validator netsdk" \
                          "fhir check qc/custom"; do
            if ! grep -qF -- "$expected" /tmp/fhir-calls.log; then
              echo "FAIL: missing call '$expected'"
              exit 1
            fi
          done
          if grep -E '^fhir check qc/custom' /tmp/fhir-calls.log | grep -q -- '--fail'; then
            echo "FAIL: --fail should be dropped with EXPECTED_FAILS=VALIDATION_CONFORMANCE_DOTNET"
            exit 1
          fi
          if grep -q '^dotnet tool install' /tmp/fhir-calls.log; then
            echo "FAIL: should not install Firely Terminal when fhir is on PATH"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f package.json
