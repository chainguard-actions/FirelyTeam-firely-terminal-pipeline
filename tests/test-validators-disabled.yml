name: Test - Both validators disabled (no-op run)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up required files in the workspace root
      - name: Set up fixture files
        run: |
          # Copy package.json to workspace root (action reads it from there)
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"
          # Create conformance resources directory
          mkdir -p "$GITHUB_WORKSPACE/conformance"
          cp "$GITHUB_WORKSPACE/tests/fixtures/conformance/"* "$GITHUB_WORKSPACE/conformance/"
          echo "Fixture files set up:"
          ls -la "$GITHUB_WORKSPACE/package.json"
          ls -la "$GITHUB_WORKSPACE/conformance/"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action completed successfully
        run: |
          echo "Action completed - both validators were disabled, so no validation was performed"
          echo "PASS: action ran to completion with validators disabled"
