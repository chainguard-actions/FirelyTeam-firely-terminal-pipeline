name: Test invalid .NET validator engine is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up project and fake dotnet/fhir
        run: |
          rm -f sushi-config.yaml /tmp/fake-fhir-inv.log
          cat > package.json <<'EOF'
          {
            "name": "test",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF
          mkdir -p /tmp/fakebin-inv
          cat > /tmp/fakebin-inv/dotnet <<'EOF'
          #!/bin/sh
          [ "$1" = "--version" ] && echo "8.0.100"
          exit 0
          EOF
          cat > /tmp/fakebin-inv/fhir <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-fhir-inv.log
          [ "$1" = "-v" ] && echo "Firely Terminal 3.4.0"
          exit 0
          EOF
          chmod +x /tmp/fakebin-inv/*
          echo "/tmp/fakebin-inv" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          SIMPLIFIER_USERNAME: user@example.com
          SIMPLIFIER_PASSWORD: secret
          DOTNET_VALIDATION_ENABLED: 'true'
          FIRELY_TERMINAL_VALIDATOR_ENGINE: bogus
          PATH_TO_QUALITY_CONTROL_RULES: qc/custom
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET
      - name: Assert action failed before running checks
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "--- fhir log ---"; cat /tmp/fake-fhir-inv.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid engine"
            exit 1
          fi
          if grep -q "^config validator" /tmp/fake-fhir-inv.log; then
            echo "FAIL: invalid engine should not be configured"
            exit 1
          fi
          if grep -q "^check" /tmp/fake-fhir-inv.log; then
            echo "FAIL: quality control should not run"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f package.json
