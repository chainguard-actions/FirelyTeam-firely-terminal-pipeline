name: Test - PATH_TO_EXAMPLES input coverage
on:
  workflow_dispatch:

jobs:
  test-path-to-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create examples directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/fhir-r4/examples"
          touch "$GITHUB_WORKSPACE/tests/fixtures/fhir-r4/examples/.gitkeep"

      - id: action
        name: Run action with PATH_TO_EXAMPLES set (both validators disabled)
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          PATH_TO_EXAMPLES: tests/fixtures/fhir-r4/examples
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action completed successfully
        run: |
          echo "PASS: Action completed with PATH_TO_EXAMPLES set (validators disabled, examples validation skipped)"
