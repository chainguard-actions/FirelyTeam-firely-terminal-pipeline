name: Test PATH_TO_EXAMPLES input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json for action
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create example directory
        run: mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/examples"

      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: "hardened/tests/fixtures/conformance"
          PATH_TO_EXAMPLES: "hardened/tests/fixtures/examples"
          DOTNET_VALIDATION_ENABLED: "false"
          JAVA_VALIDATION_ENABLED: "false"
          SUSHI_ENABLED: "false"
          SIMPLIFIER_USERNAME: "test@example.com"
          SIMPLIFIER_PASSWORD: "testpassword"

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with PATH_TO_EXAMPLES input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
