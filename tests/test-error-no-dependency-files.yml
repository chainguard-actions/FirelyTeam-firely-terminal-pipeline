name: Test error when no package.json or sushi-config.yaml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no dependency files in workspace root
        run: rm -f "$GITHUB_WORKSPACE/package.json" "$GITHUB_WORKSPACE/sushi-config.yaml" "$GITHUB_WORKSPACE/validator_cli.jar"
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/profiles
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'true'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no package.json/sushi-config.yaml exist"; exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/validator_cli.jar" ]; then
            echo "FAIL: should have failed before downloading the Java validator"; exit 1
          fi
          echo "PASS"
