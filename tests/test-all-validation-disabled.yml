name: Test all validation disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no leftover project files
        run: rm -f package.json sushi-config.yaml
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
      - name: Assert action succeeded and nothing was generated
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -f package.json ]; then
            echo "FAIL: package.json should not have been generated"
            exit 1
          fi
          if [ -n "$FHIR_VERSION" ]; then
            echo "FAIL: FHIR_VERSION should not be set, got '$FHIR_VERSION'"
            exit 1
          fi
          echo "PASS"
