name: Test all validation disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
      - name: Assert action succeeded and skipped FHIR version detection
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "FHIR_VERSION: '${FHIR_VERSION:-}'"
          echo "NEED_SUSHI_CONVERSION: '${NEED_SUSHI_CONVERSION:-}'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "${FHIR_VERSION:-}" ] || [ -n "${NEED_SUSHI_CONVERSION:-}" ]; then
            echo "FAIL: detection should have been skipped"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/package.json" ]; then
            echo "FAIL: package.json should not have been created"
            exit 1
          fi
          echo "PASS"
