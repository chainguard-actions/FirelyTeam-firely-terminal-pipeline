name: Test error when SUSHI_USE_CONFIG_DEPENDENCIES=true but no sushi-config.yaml
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create only package.json, no sushi-config.yaml
      - name: Create package.json without sushi-config.yaml
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "description": "Test FHIR project",
            "fhirVersions": [
              "4.0.1"
            ],
            "dependencies": {}
          }
          EOF
          rm -f sushi-config.yaml
          echo "Created package.json, removed sushi-config.yaml"

      # Create a minimal conformance resources directory
      - name: Create conformance resources directory
        run: mkdir -p conformance

      # The action should fail because SUSHI_USE_CONFIG_DEPENDENCIES=true but no sushi-config.yaml.
      # JAVA_VALIDATION_ENABLED=true triggers FHIR detection which checks for sushi-config.yaml
      # and exits 1 when it is not found. The action fails before any network calls.
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: true
          SUSHI_ENABLED: false
          SUSHI_USE_CONFIG_DEPENDENCIES: true
          TERMINOLOGY_SERVICE_BFARM_ENABLED: false
          JAVA_SNAPSHOT_ENABLED: false
          CLOSE_SLICING_FOR_VALIDATION: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: testpassword

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail when SUSHI_USE_CONFIG_DEPENDENCIES=true but no sushi-config.yaml, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: Action correctly failed when SUSHI_USE_CONFIG_DEPENDENCIES=true but sushi-config.yaml not found"
