name: Test - No package.json, both validators disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal conformance resources directory (remove package.json if present)
        run: |
          mkdir -p conformance-resources
          rm -f package.json sushi-config.yaml

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance-resources
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: testpassword

      - name: Assert action completed successfully without package.json
        run: |
          echo "Action completed without errors even without package.json when both validators are disabled"
          echo "PASS: FHIR version detection is correctly skipped when no validation is enabled"
