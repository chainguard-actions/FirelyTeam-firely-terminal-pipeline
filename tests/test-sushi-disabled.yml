name: Test - SUSHI disabled with FHIR R5
on:
  workflow_dispatch:

jobs:
  test-sushi-disabled-r5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create package.json with FHIR R5 version
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-r5-project",
            "version": "1.0.0",
            "description": "Test FHIR R5 project",
            "fhirVersions": [
              "5.0.0"
            ],
            "dependencies": {}
          }
          EOF
          echo "Created package.json with FHIR R5:"
          cat "$GITHUB_WORKSPACE/package.json"

      - id: action
        name: Run action with SUSHI disabled and both validators disabled (FHIR R5)
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action completed successfully with SUSHI disabled
        run: |
          echo "PASS: Action completed with SUSHI disabled and FHIR R5 package.json"
