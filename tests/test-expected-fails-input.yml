name: Test - Expected Fails Input Handling
on:
  workflow_dispatch:

jobs:
  test-expected-fails-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal package.json fixture
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-project",
            "version": "1.0.0",
            "fhirVersions": ["4.0.1"],
            "dependencies": {}
          }
          EOF

      - name: Create minimal conformance resources directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resources"

      # Test that EXPECTED_FAILS input is accepted without errors
      # when validation is disabled (all validation steps are skipped)
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          EXPECTED_FAILS: VALIDATION_CONFORMANCE_DOTNET VALIDATION_CONFORMANCE_JAVA VALIDATION_EXAMPLES_JAVA
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password

      - name: Assert action accepted EXPECTED_FAILS input without errors
        run: |
          echo "PASS: Action accepted EXPECTED_FAILS input and completed with validation disabled"
