name: Test - FHIR version detection from package.json
on:
  workflow_dispatch:

jobs:
  test-fhir-version-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up package.json with FHIR R4 version
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fhir-r4-project",
            "version": "1.0.0",
            "description": "Test FHIR R4 project",
            "fhirVersions": [
              "4.0.1"
            ],
            "dependencies": {}
          }
          EOF
          echo "Created package.json:"
          cat "$GITHUB_WORKSPACE/package.json"

      - id: action
        name: Run Firely Terminal action (dotnet enabled, java disabled)
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/fhir-r4/conformance
          DOTNET_VALIDATION_ENABLED: true
          JAVA_VALIDATION_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password
          SUSHI_ENABLED: false
          FIRELY_TERMINAL_VERSION: '3.5.0'

      - name: Assert action ran (may fail at Simplifier login with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at Simplifier login with fake credentials,
          # OR it may fail at package restore. Either way, it should have gotten past
          # the FHIR version detection step (which uses package.json).
          # We accept both success (unlikely with fake creds) and failure (expected).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake Simplifier credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
