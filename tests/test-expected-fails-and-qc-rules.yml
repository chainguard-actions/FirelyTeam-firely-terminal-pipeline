name: Test - EXPECTED_FAILS and PATH_TO_QUALITY_CONTROL_RULES inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal project files
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"
          mkdir -p "$GITHUB_WORKSPACE/conformance"

      # With both validators disabled, EXPECTED_FAILS and PATH_TO_QUALITY_CONTROL_RULES
      # are accepted as inputs but not acted upon — the action should complete successfully.
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
          EXPECTED_FAILS: 'VALIDATION_CONFORMANCE_DOTNET'
          PATH_TO_QUALITY_CONTROL_RULES: 'qc/minimal'
          SIMPLIFIER_USERNAME: 'test@example.com'
          SIMPLIFIER_PASSWORD: 'testpassword'

      - name: Assert action completed successfully
        run: |
          echo "PASS: action ran through all steps with EXPECTED_FAILS and PATH_TO_QUALITY_CONTROL_RULES set"
          echo "      (both validators disabled so these inputs are accepted but not used)"
