name: Test - dotnet validation enabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up .NET SDK (required for dotnet validation)
      - name: Set up .NET SDK
        run: |
          dotnet --version || true
          echo "dotnet availability checked"

      # Copy fixture package.json to workspace root
      - name: Set up fixture package.json
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"

      # Create a minimal conformance resource directory
      - name: Create conformance resource directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/conformance"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/conformance/StructureDefinition-example.json" << 'EOF'
          {
            "resourceType": "StructureDefinition",
            "id": "example",
            "url": "http://example.org/fhir/StructureDefinition/example",
            "name": "Example",
            "status": "draft",
            "kind": "resource",
            "abstract": false,
            "type": "Patient",
            "baseDefinition": "http://hl7.org/fhir/StructureDefinition/Patient",
            "derivation": "constraint"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: "tests/fixtures/conformance"
          DOTNET_VALIDATION_ENABLED: "true"
          JAVA_VALIDATION_ENABLED: "false"
          SUSHI_ENABLED: "false"
          SIMPLIFIER_USERNAME: "test@example.com"
          SIMPLIFIER_PASSWORD: "test-password"

      - name: Assert action ran (Simplifier login will fail with test credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with dotnet validation"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - Simplifier login requires real credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
