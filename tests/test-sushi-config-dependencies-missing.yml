name: Test SUSHI_USE_CONFIG_DEPENDENCIES without sushi-config fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json only
        run: |
          rm -f sushi-config.yaml
          cat > package.json <<'EOF'
          { "name": "test", "version": "1.0.0", "fhirVersions": ["4.0.1"], "dependencies": {} }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: resources
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'true'
          SUSHI_USE_CONFIG_DEPENDENCIES: 'true'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when sushi-config.yaml is missing"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -f package.json
