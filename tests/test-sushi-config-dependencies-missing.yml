name: Test error when SUSHI_USE_CONFIG_DEPENDENCIES is set without sushi-config.yaml
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no sushi-config.yaml in workspace root
        run: rm -f "$GITHUB_WORKSPACE/sushi-config.yaml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests
          SIMPLIFIER_USERNAME: unused@example.com
          SIMPLIFIER_PASSWORD: unused
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'true'
          SUSHI_USE_CONFIG_DEPENDENCIES: 'true'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure"
            exit 1
          fi
          if [ -n "${NEED_SUSHI_CONVERSION:-}" ] || [ -n "${FHIR_VERSION:-}" ]; then
            echo "FAIL: strategy env vars should not be set"
            exit 1
          fi
          echo "PASS"
