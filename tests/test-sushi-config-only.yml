name: Test - sushi-config.yaml only, no validation
on:
  workflow_dispatch:

jobs:
  test-sushi-config-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create only sushi-config.yaml (no package.json)
      # When both validators are disabled, FHIR version detection is skipped
      # so the action should complete without needing package.json
      - name: Create sushi-config.yaml (no package.json)
        run: |
          # Remove any existing package.json to ensure only sushi-config.yaml is present
          rm -f package.json
          cat > sushi-config.yaml << 'EOF'
          id: test.fhir.project
          canonical: http://example.org/fhir
          name: TestFHIRProject
          status: draft
          version: 0.1.0
          fhirVersion: 4.0.1
          dependencies:
            hl7.fhir.r4.core: 4.0.1
          EOF

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: tests/fixtures/conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: test-password
          FIRELY_TERMINAL_VERSION: '3.5.0'
          JAVA_VALIDATOR_VERSION: '6.9.5'
          SUSHI_VERSION: '3.18.1'

      - name: Assert action completed with sushi-config.yaml only
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "FAIL: expected action to succeed when both validators are disabled (even with only sushi-config.yaml)"
            exit 1
          fi
          echo "PASS: action completed successfully with sushi-config.yaml only and validators disabled"

      - name: Cleanup sushi-config.yaml
        if: always()
        run: rm -f sushi-config.yaml
