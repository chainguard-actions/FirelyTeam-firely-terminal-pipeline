name: Test - dotnet validation with engine, QC rules and expected fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fixture package.json
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          PATH_TO_CONFORMANCE_RESOURCES: "tests/fixtures"
          PATH_TO_EXAMPLES: "tests/fixtures"
          PATH_TO_QUALITY_CONTROL_RULES: "minimal"
          EXPECTED_FAILS: "VALIDATION_CONFORMANCE_DOTNET"
          FIRELY_TERMINAL_VALIDATOR_ENGINE: "netsdk"
          DOTNET_VALIDATION_ENABLED: "true"
          JAVA_VALIDATION_ENABLED: "false"
          SUSHI_ENABLED: "false"
          SIMPLIFIER_USERNAME: "test@example.com"
          SIMPLIFIER_PASSWORD: "test-password"

      - name: Assert action ran (Simplifier login needs real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (test Simplifier credentials / dotnet availability)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
