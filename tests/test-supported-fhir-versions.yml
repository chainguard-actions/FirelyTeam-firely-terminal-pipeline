name: Test all supported FHIR versions are accepted
on:
  workflow_dispatch:

jobs:
  test-r3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json with FHIR R3 (3.0.2)
        run: |
          cat > package.json << 'EOF'
          {
            "name": "test-fhir-r3",
            "version": "1.0.0",
            "fhirVersions": ["3.0.2"],
            "dependencies": {}
          }
          EOF
      - name: Create conformance directory
        run: mkdir -p conformance
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: false
          JAVA_VALIDATION_ENABLED: false
          SUSHI_ENABLED: false
          SUSHI_USE_CONFIG_DEPENDENCIES: false
          TERMINOLOGY_SERVICE_BFARM_ENABLED: false
          JAVA_SNAPSHOT_ENABLED: false
          CLOSE_SLICING_FOR_VALIDATION: false
          SIMPLIFIER_USERNAME: test@example.com
          SIMPLIFIER_PASSWORD: testpassword
      - name: Assert R3 accepted
        run: |
          echo "PASS: FHIR R3 (3.0.2) accepted"

  test-r4:
