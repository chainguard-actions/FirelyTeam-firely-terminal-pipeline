name: Test - FHIR version detection skipped when both validators disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # No package.json is created here — the action should skip FHIR version
      # detection entirely when both DOTNET_VALIDATION_ENABLED and
      # JAVA_VALIDATION_ENABLED are false.
      - name: Set up conformance directory (no package.json)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/conformance"

      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
          SIMPLIFIER_USERNAME: 'test@example.com'
          SIMPLIFIER_PASSWORD: 'testpassword'

      - name: Assert action completed without package.json
        run: |
          echo "PASS: action completed successfully - FHIR version detection was skipped"
          echo "      (no package.json required when both validators are disabled)"
