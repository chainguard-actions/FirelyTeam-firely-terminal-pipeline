name: Test - FIRELY_TERMINAL_VALIDATOR_ENGINE input (validators disabled)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal project files
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/package.json" "$GITHUB_WORKSPACE/package.json"
          mkdir -p "$GITHUB_WORKSPACE/conformance"

      # With DOTNET_VALIDATION_ENABLED=false, the "Configure Firely Terminal validator engine"
      # step is skipped entirely. The FIRELY_TERMINAL_VALIDATOR_ENGINE input is accepted
      # but not acted upon, so the action should complete successfully.
      - id: action
        uses: .
        with:
          PATH_TO_CONFORMANCE_RESOURCES: conformance
          DOTNET_VALIDATION_ENABLED: 'false'
          JAVA_VALIDATION_ENABLED: 'false'
          SUSHI_ENABLED: 'false'
          FIRELY_TERMINAL_VALIDATOR_ENGINE: 'firely'
          SIMPLIFIER_USERNAME: 'test@example.com'
          SIMPLIFIER_PASSWORD: 'testpassword'

      - name: Assert action completed successfully
        run: |
          echo "PASS: action ran through all steps with FIRELY_TERMINAL_VALIDATOR_ENGINE=firely"
          echo "      (DOTNET_VALIDATION_ENABLED=false so engine configuration step is skipped)"
